# Python tooling and the bio tools used in tests. Rust comes from rustup and
# Qt from the system packages. Environments are detached to ~/.cache/pixi/envs
# (see .pixi/config.toml) to keep them out of the synced folder.
[workspace]
name = "basecraft"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.13.*"
pyarrow = "*"
numpy = "*"
maturin = "*"
ruff = "*"
pyright = "*"
pytest = "*"

[feature.tools.dependencies]
mafft = "*"
trimal = "*"
iqtree = "*"

[environments]
default = { features = ["tools"], solve-group = "default" }
