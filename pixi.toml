# Python tooling and the bio tools used in tests. Rust comes from rustup and
# Qt from the system packages. Configure detached environments in user-level
# Pixi configuration when build storage must live outside the checkout.
[workspace]
name = "basecraft"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.13.*"
pyarrow = "*"
numpy = "*"
maturin = "*"
ruff = "*"
pyright = "*"
pytest = "*"

[feature.tools.dependencies]
mafft = "*"
trimal = "*"
iqtree = "*"
fasttree = "*"
pyrodigal = "*"

[environments]
default = { features = ["tools"], solve-group = "default" }
