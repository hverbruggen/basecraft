[package]
name = "basecraft-io"
description = "Format readers and writers, indexes, immutable file sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[features]
test-counters = []
test-heap = []

[dependencies]
# Spreadsheet parsing and ZIP template/container handling.
calamine = { version = "0.38", features = ["chrono"] }
zip = { version = "9.1", default-features = false, features = ["deflate"] }
# Only used to preflight ODS expansion before calamine allocates its ranges.
roxmltree = { path = "../../vendor/roxmltree" }
basecraft-protocol.workspace = true
blake3.workspace = true
sha2.workspace = true
memchr.workspace = true
tempfile.workspace = true
thiserror.workspace = true

# Test-only allocator accounting uses unsafe code, so this crate cannot
# inherit the workspace lints, which deny it. Keep this list in sync.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they catch.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
