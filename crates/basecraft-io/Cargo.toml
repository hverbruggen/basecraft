[package]
name = "basecraft-io"
description = "Format readers and writers, indexes, memory mapping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
roxmltree = { path = "../../vendor/roxmltree" }
basecraft-protocol.workspace = true
blake3.workspace = true
sha2.workspace = true
memchr.workspace = true
memmap2.workspace = true
tempfile.workspace = true
thiserror.workspace = true

# This crate may use unsafe code (mmap, signal handling), so it can't
# inherit the workspace lints, which deny it. Keep this list in sync.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they catch.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
