[package]
name = "basecraft-ops"
description = "Operation registry, undo and redo, operation log, replay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[features]
test-counters = ["basecraft-io/test-counters"]
test-heap = ["basecraft-io/test-heap"]

[dependencies]
fs4 = "0.13"
basecraft-docs.workspace = true
basecraft-io.workspace = true
basecraft-platform.workspace = true
basecraft-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
ulid.workspace = true

# Bench-only public viewmodel client; never a production ops dependency.
[dev-dependencies]
basecraft-viewmodel.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix.workspace = true

[lints]
workspace = true

[[bench]]
name = "interaction"
harness = false
