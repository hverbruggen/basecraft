[package]
name = "basecraft-gui"
description = "Qt/QML desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
basecraft-docs.workspace = true
basecraft-io.workspace = true
basecraft-ops.workspace = true
basecraft-protocol.workspace = true
basecraft-viewmodel.workspace = true
serde_json.workspace = true
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

# The cxx-qt bridge macros generate unsafe FFI code, so this crate can't
# inherit the workspace lints, which deny it. Keep this list in sync.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they catch.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"

