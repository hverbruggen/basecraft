[package]
name = "basecraft-platform"
description = "Platform traits over file watching, shared memory, signals and sockets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
memmap2.workspace = true
rustix = { workspace = true, features = ["process"] }
serde.workspace = true
toml = { workspace = true, features = ["display"] }
thiserror.workspace = true
fs4 = "0.13"

tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

# This crate may use unsafe code (mmap, signal handling), so it can't
# inherit the workspace lints, which deny it. Keep this list in sync.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they catch.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
