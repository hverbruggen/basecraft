schema_version = 1
revision = 1

[ui]
# Optional override in points (6–32); absent uses platform size minus 3, minimum 6.
# font_size_points = 9
# Independent ribbon icons, labels and layout (100–200 percent).
ribbon_size_percent = 100
# Tick boxes (8–40 pixels) and number or text boxes (14–60 pixels high).
tick_box_size = 14
input_box_height = 20
show_gc = true
sidebar_open = true
orf_min_codons = 100
alignment_insert = true

[files]
provenance = "portable"
recovery = true
remember_workspace = false
persistent_browsing_indexes = false

[compute]
local_cpu_threads = 4

[customization]
ribbon_hidden = []

[customization.shortcuts]
"file.save" = "Ctrl+S"

[migration]
qsettings_imported = false
