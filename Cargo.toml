[workspace]
resolver = "3"
members = ["crates/*", "testdata/generate"]
# Spikes are separate Cargo workspaces so their dependencies stay out of this lockfile.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
# Nothing is published to crates.io yet.
publish = false
repository = "https://github.com/hverbruggen/basecraft"

[workspace.dependencies]
basecraft-protocol = { path = "crates/basecraft-protocol" }
basecraft-io = { path = "crates/basecraft-io" }
basecraft-docs = { path = "crates/basecraft-docs" }
basecraft-ops = { path = "crates/basecraft-ops" }
basecraft-query = { path = "crates/basecraft-query" }
basecraft-platform = { path = "crates/basecraft-platform" }
basecraft-viewmodel = { path = "crates/basecraft-viewmodel" }
basecraft-plugin-host = { path = "crates/basecraft-plugin-host" }

blake3 = "1.8"
memchr = "2.8"
memmap2 = "0.9"
schemars = "1.2"
ulid = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"

# basecraft-io and basecraft-platform can't inherit these because they allow
# unsafe code. Mirror any change here in their Cargo.toml.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they catch.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"

[profile.release]
debug = "line-tables-only"

[profile.bench]
debug = true
