[workspace]
resolver = "3"
members = ["crates/*", "testdata/generate"]
exclude = ["vendor/roxmltree"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
# Nothing is published to crates.io yet.
publish = false
repository = "https://github.com/hverbruggen/basecraft"

[workspace.dependencies]
basecraft-protocol = { path = "crates/basecraft-protocol" }
basecraft-io = { path = "crates/basecraft-io" }
basecraft-docs = { path = "crates/basecraft-docs" }
basecraft-ops = { path = "crates/basecraft-ops" }
basecraft-query = { path = "crates/basecraft-query" }
basecraft-platform = { path = "crates/basecraft-platform" }
basecraft-viewmodel = { path = "crates/basecraft-viewmodel" }
basecraft-plugin-host = { path = "crates/basecraft-plugin-host" }

arrow-array = { version = "60", default-features = false }
arrow-ipc = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }
rayon = "1.12"
blake3 = "1.8"
sha2 = "0.10.9"
memchr = "2.8"
memmap2 = "0.9"
rustix = { version = "1.1", features = ["fs", "net"] }
schemars = "1.2"
ulid = "3.0"
serde = { version = "1.0", features = ["derive"] }
# Journals hash canonical JSON before writing; parsing must preserve every
# serialized binary64 value exactly when checking that checksum on replay.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tempfile = "3.27"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

# basecraft-io and basecraft-platform can't inherit these because they allow
# unsafe code. Mirror any change here in their Cargo.toml.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they catch.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"

[profile.release]
debug = "line-tables-only"

# Feedback builds package the dev profile, and unoptimized analysis engines mislead
# everyone testing them. Their numeric code runs at full speed there too.
[profile.dev.package.basecraft-distance]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.basecraft-delimitation]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.basecraft-asap]
opt-level = 3
debug-assertions = false
overflow-checks = false

# `cargo test` inherits the dev profile; keep these checks while testing.
[profile.test.package.basecraft-distance]
debug-assertions = true
overflow-checks = true

[profile.test.package.basecraft-delimitation]
debug-assertions = true
overflow-checks = true

[profile.test.package.basecraft-asap]
debug-assertions = true
overflow-checks = true

[profile.dev.package.basecraft-platform]
opt-level = 3

[profile.dev.package.rayon]
opt-level = 3

[profile.dev.package.rayon-core]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.bench]
debug = true
