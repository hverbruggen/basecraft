# Relative timing limits from M5, separate from PRD qualification.
[comparison]
benchmark_ratio = 1.30
gross_ci_ratio = 2.0

[scenarios.open-alignment]
fixture = "32 rows x 4096 columns; rowNNN; ACGT rotated by row; .afa"
measurement = "Session::open only, warm cache, recoverable session"

[scenarios.open-fasta-100mb]
fixture = "100000000 decimal file bytes; single sequence; 80-base wrapped ACGT"
measurement = "Session::open only; warm cache; no first-paint claim"

[scenarios.edit-alignment]
fixture = "compact alignment; 1000 distinct row-0 single-residue replacements with N"
measurement = "sum of 1000 Session::apply durations / 1000, including first-edit retention and journal write"
prd_context = "16 ms input-to-screen target requires separate GUI/frame measurement"

[scenarios.undo-alignment]
fixture = "compact alignment after 1000 single-residue edits"
measurement = "sum of 1000 Session::undo durations / 1000"

[scenarios.save-alignment]
fixture = "compact alignment after 1000 edits; overwrite original path"
measurement = "Session::save only; reopen and all-row verification outside timer"

[scenarios.open-fasta-1gb]
fixture = "1000000000 decimal file bytes; opt-in single sequence"
measurement = "warm-cache Session::open; failures/refusals reported explicitly"
prd_context = "1 s first paint for 1 GB is a separate unmeasured GUI target"

# Explicitly selected frame cases share these work parameters; see raw `work`.
[frames]
protocol = "headless-frame-v1"
viewport = [3840, 2160]
zoom_px = 8.0
theme = "Theme::default"
alignment = "256/1024 rows x 4096 columns; ACGT; rowNNNNN"
genome = "100000 bases linear/wrapped; 1000000 bases wrapped; two gene markers per 100 bases"
first = "fresh view/sync + empty Frame + first build; document/index/theme already constructed"
warm = "one origin build with warmed view/cache and reused Frame"
scroll = "sum of 200 scroll_to + build durations, i/199 across full clamped range; both alignment axes"
verification = "finite labelled residue geometry, visible annotations, full float equality to fresh-view replay outside timing"

[trees]
protocol = "session-tree-v1"
tips = 50000
shape = "balanced binary, contiguous floor-half splits; max depth 16"
branches = "positive integer 1+(start*17+count*13)%97 on every nonroot subtree"
open = "warm-cache recoverable Session::open only"
midpoint = "one Session::apply(TreeMidpointRoot), first-edit recovery/journal/undo state included"
verification = "all tip identities, finite branches, topology, total length, undo hashes, redo, journal replay, unchanged source"

# Generous headless regression limits, distinct from PRD first-paint targets.
# These work on an uncalibrated machine; named-machine history adds a relative gate.
[limits_ms]
open-alignment = 100
open-fasta-100mb = 1500
open-fasta-1gb = 15000
edit-alignment = 16
undo-alignment = 16
save-alignment = 500
frame = 16
tree-open-50000 = 5000
tree-midpoint-50000 = 5000
