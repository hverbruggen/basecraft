schema = 1
id = "basecraft.mafft"
name = "MAFFT"
version = "0.2.0"
kinds = ["operation"]

[entry]
operation = "python:mafft_plugin.py"

# Software the plugin needs, as conda specs (ADR 0003). Until Basecraft
# builds environments from these, MAFFT comes from the project's pixi
# environment, $BASECRAFT_MAFFT, or the PATH.
[environment]
conda = ["bioconda::mafft"]

[[operations]]
name = "align"
label = "Align sequences with MAFFT (default settings)"

[[operations]]
name = "place_sanger"
label = "Place a Sanger draft against a frozen alignment"

[[operations]]
name = "add_sequences"
label = "Add sequences to an existing alignment without losing bases"
