schema = 1
id = "basecraft.fasttree"
name = "FastTree"
version = "0.1.0"
kinds = ["operation"]

[entry]
operation = "python:fasttree_plugin.py"

# Software the plugin needs, as conda specs (ADR 0003). Until Basecraft
# builds environments from these, FastTree comes from the project's pixi
# environment, $BASECRAFT_FASTTREE, or the PATH.
[environment]
conda = ["bioconda::fasttree"]

[[operations]]
name = "tree"
label = "Infer a maximum-likelihood tree with FastTree (GTR for DNA, LG for protein)"
