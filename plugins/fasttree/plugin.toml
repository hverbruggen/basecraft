schema = 1
id = "basecraft.fasttree"
name = "FastTree"
version = "0.1.0"
kinds = ["operation"]

[entry]
operation = "python:fasttree_plugin.py"

# Software the plugin needs, as conda specs (ADR 0003). Until Basecraft
# builds environments from these, FastTree comes from the project's pixi
# environment, $BASECRAFT_FASTTREE, or the PATH.
[environment]
conda = ["bioconda::fasttree"]

[[operations]]
name = "tree"
label = "Infer a maximum-likelihood tree with FastTree (GTR for DNA, LG for protein)"

# The settings the app asks for before a run. The app draws the form from
# these fields and sends their values as parameters.
[[forms]]
id = "tree"
title = "FastTree"
operation = "tree"
button = "Build tree"
output = ["fasttree", "nwk"]
min_rows = 3
working = "Building a tree with FastTree…"
note = "SH-like local support is a fast test of each branch, written on the tree as a value from 0 to 1. It is not a bootstrap proportion. Identical sequences are joined without a support value."

[[forms.fields]]
name = "model"
label = "Substitution model"
type = "choice"
# Only the models for the alignment's sequence type are offered; the first
# is the default.
default = "GTR"
choices = [["GTR", "GTR", "sequence == dna"], ["JC", "JC", "sequence == dna"], ["LG", "LG", "sequence == protein"], ["WAG", "WAG", "sequence == protein"], ["JTT", "JTT", "sequence == protein"]]

[[forms.fields]]
name = "gamma"
label = "Gamma rate variation (rescales lengths; default: CAT categories)"
type = "boolean"
default = false

[[forms.fields]]
name = "support"
label = "SH-like local support"
type = "boolean"
default = true

[[forms.fields]]
name = "resamples"
label = "Resamples"
type = "integer"
default = 1000
min = 1
max = 100000
when = "support == true"
