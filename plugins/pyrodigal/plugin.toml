schema = 1
id = "basecraft.pyrodigal"
name = "Pyrodigal"
version = "0.1.0"
kinds = ["operation"]

[entry]
operation = "python:pyrodigal_plugin.py"

# Software the plugin needs, as conda specs (ADR 0003). Until Basecraft
# builds environments from these, Pyrodigal comes from the project's pixi
# environment.
[environment]
conda = ["bioconda::pyrodigal"]

[[operations]]
name = "predict_genes"
label = "Predict protein-coding genes with Prodigal (via Pyrodigal)"
