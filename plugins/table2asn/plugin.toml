schema = 2
contract = "operations.json"
id = "basecraft.table2asn"
name = "NCBI table2asn"
version = "0.1.0"
kinds = ["operation"]

[entry]
operation = "python:table2asn_plugin.py"

# Informational legacy declaration; this does not provision a runtime.
# Matching-source cross-platform packages are staged in packaging/table2asn.
# Activate [runtime] only with retained native artifacts, a frozen Pixi lock
# and exact native version checks. Never turn this into an unpinned solve or
# silently substitute a mutable upstream download for a requested version.
# Until activation, the existing explicit override/environment/PATH behaviour
# remains available; automatic pinned installation is not delivered yet.
[environment]
conda = ["bioconda::table2asn"]
