schema = 2
contract = "operations.json"
id = "basecraft.table2asn"
name = "NCBI table2asn"
version = "0.1.0"
kinds = ["operation"]

[entry]
operation = "python:table2asn_plugin.py"

# Informational legacy declaration for targets without a supported runtime.
[environment]
conda = ["bioconda::table2asn"]

# Linux feedback deployment only. The immutable file channel is local to the
# authorized workstation; public cross-machine distribution is pending.
# Other platforms retain the legacy unmanaged behavior above.
[runtime]
platforms = ["linux-64"]
channels = ["file:///private/local-path", "conda-forge"]
lock = "pixi.lock"
executables = ["table2asn"]

[runtime.dependencies]
basecraft-table2asn = "==30.8.0"

[runtime.version-checks.table2asn]
args = ["-version"]
expected = "table2asn: 1.30.0"
