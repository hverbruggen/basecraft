schema = 2
contract = "operations.json"
id = "basecraft.table2asn"
name = "NCBI table2asn"
version = "0.1.0"
kinds = ["operation"]

[entry]
operation = "python:table2asn_plugin.py"

# Informational legacy declaration for targets without a supported runtime.
[environment]
conda = ["bioconda::table2asn"]

# A qualified deployment adds its channels and frozen lock at packaging time.
# The source checkout intentionally has no machine-specific deployment lock.
# See packaging/table2asn/README.md; no unpinned runtime is installed.
[runtime]
platforms = ["linux-64"]
channels = ["conda-forge"]
executables = ["table2asn"]

[runtime.dependencies]
basecraft-table2asn = "==30.8.0"

[runtime.version-checks.table2asn]
args = ["-version"]
expected = "table2asn: 1.30.0"
