schema = 1
id = "basecraft.iqtree"
name = "IQ-TREE maximum-likelihood inference"
version = "0.1.0"
kinds = ["operation"]
[entry]
operation = "python:iqtree_plugin.py"
[[operations]]
name = "tree"
label = "Infer a tree with IQ-TREE and retain the analysis report"

# The settings the app asks for before a run (see plugins/fasttree).
[[forms]]
id = "tree"
title = "IQ-TREE"
operation = "tree"
button = "Build tree"
output = ["iqtree", "nwk"]
min_rows = 4
working = "Building a tree with IQ-TREE…"
threads = true
note = "ModelFinder tests models with and without rate variation and uses the best by BIC. Uses the allocated CPU threads. Support values are written on the branches of the tree."

[[forms.fields]]
name = "model"
label = "Substitution model"
type = "choice"
default = "MFP"
# Models for the alignment's sequence type only.
choices = [["MFP", "ModelFinder (best fit by BIC)"], ["JC", "JC", "sequence == dna"], ["F81", "F81", "sequence == dna"], ["K2P", "K2P", "sequence == dna"], ["HKY", "HKY", "sequence == dna"], ["TN", "TN", "sequence == dna"], ["TIM", "TIM", "sequence == dna"], ["TVM", "TVM", "sequence == dna"], ["GTR", "GTR", "sequence == dna"], ["LG", "LG", "sequence == protein"], ["WAG", "WAG", "sequence == protein"], ["JTT", "JTT", "sequence == protein"], ["Dayhoff", "Dayhoff", "sequence == protein"], ["mtREV", "mtREV", "sequence == protein"], ["cpREV", "cpREV", "sequence == protein"], ["Blosum62", "Blosum62", "sequence == protein"]]

[[forms.fields]]
name = "gamma"
label = "Gamma rate variation (+G)"
type = "boolean"
default = true
when = "model != MFP"

[[forms.fields]]
name = "invariant"
label = "Invariant sites (+I)"
type = "boolean"
default = false
when = "model != MFP"

[[forms.fields]]
name = "support"
label = "Branch support"
type = "choice"
default = "none"
choices = [["none", "None"], ["ufboot", "Ultrafast bootstrap (UFBoot)"], ["bootstrap", "Standard bootstrap"]]

[[forms.fields]]
name = "replicates"
label = "Replicates"
type = "integer"
default = 1000
min = 1
max = 100000
when = "support != none"
# UFBoot needs at least 1000 replicates.
min_when = [["support == ufboot", 1000]]

[[forms.fields]]
name = "bootstrap_destination"
label = "Save bootstrap trees in"
type = "choice"
default = "metadata"
choices = [["metadata", "Metadata folder (.basecraft)"], ["working", "Working folder"]]
when = "support == bootstrap"

[[forms.fields]]
name = "seed"
label = "Seed"
type = "integer"
default = 1
min = 1
max = 100000
